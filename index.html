        message: ""

      const [formSubmitted, setFormSubmitted] = useState(false);

      // Gestion de l'état au défilement (Glassmorphism & Navbar sticky)
      useEffect(() => {
        const handleScroll = () => {
          if (window.scrollY > 40) {
            setIsScrolled(true);
          } else {
            setIsScrolled(false);
          }
        };
        window.addEventListener("scroll", handleScroll);
        return () => window.removeEventListener("scroll", handleScroll);
      }, []);

      // Synchronisation du service pré-sélectionné

                      <span className="text-brand-gold font-heading font-black text-2xl tracking-wider">FKF</span>
                      <h3 className="font-heading font-bold text-lg text-white mt-1">
                        {SITE_CONFIG.company.fullName}
                      </h3>
                      <p className="text-slate-400 text-xs mt-1">
                        Partenaire logistique et assainissement industriel
                      </p>
                    </div>

                    <div className="space-y-6 text-sm">
                      {/* Localisation */}
                      <div className="flex items-start gap-4">
                        <div className="w-10 h-10 rounded-lg bg-brand-gold/15 border border-brand-gold/30 text-brand-gold flex items-center justify-center shrink-0">
                          <Icon name="MapPin" size={20} />
                        </div>
                        <div>
                          <div className="font-heading font-bold text-xs text-brand-gold uppercase tracking-wider">Siège & Opérations</div>
                          <div className="text-slate-200 mt-0.5">{SITE_CONFIG.contact.addressLine}</div>
                          <div className="text-slate-400 text-xs">{SITE_CONFIG.contact.country}</div>
                        </div>
                      </div>

                      {/* Téléphone */}
                      <div className="flex items-start gap-4">
                        <div className="w-10 h-10 rounded-lg bg-brand-gold/15 border border-brand-gold/30 text-brand-gold flex items-center justify-center shrink-0">
                          <Icon name="Phone" size={20} />
                        </div>
                        <div>
                          <div className="font-heading font-bold text-xs text-brand-gold uppercase tracking-wider">Ligne Téléphonique & WhatsApp</div>
                          <a href={SITE_CONFIG.contact.phoneHref} className="block text-slate-200 hover:text-brand-gold transition-colors mt-0.5">{SITE_CONFIG.contact.phone}</a>
                          <div className="text-slate-400 text-xs">Accueil & service client</div>
                        </div>
                      </div>

                      {/* E-mail */}
                      <div className="flex items-start gap-4">
                        <div className="w-10 h-10 rounded-lg bg-brand-gold/15 border border-brand-gold/30 text-brand-gold flex items-center justify-center shrink-0">
                          <Icon name="Mail" size={20} />
                        </div>
                        <div>
                          <div className="font-heading font-bold text-xs text-brand-gold uppercase tracking-wider">Courrier Électronique</div>
                          <a href={SITE_CONFIG.contact.emailHref} className="block text-slate-200 hover:text-brand-gold transition-colors mt-0.5">{SITE_CONFIG.contact.email}</a>
                          <div className="text-slate-400 text-xs">Réception des appels d'offres</div>
                        </div>
                      </div>
                    </div>

                    <div className="pt-4 border-t border-slate-700/80">
                      <p className="text-slate-400 text-xs italic">
                        * Les informations de contact ci-dessus sont directement administrables via le bloc de configuration SITE_CONFIG.
                      </p>
                    </div>
                  </div>

                  {/* Grand Bouton WhatsApp Business */}
                  <a 
                    href={SITE_CONFIG.contact.whatsappHref} 
                    target="_blank" 
                    rel="noopener noreferrer"
                    className="w-full bg-[#25D366] hover:bg-[#20ba59] text-white p-5 rounded-2xl shadow-lg hover:shadow-xl transition-all duration-300 flex items-center justify-center gap-4 group transform hover:-translate-y-1"
                  >
                    <div className="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center text-white">
                      <Icon name="MessageCircle" size={24} />
                    </div>
                    <div className="text-left">
                      <div className="font-heading font-bold text-sm tracking-wider uppercase">Discuter sur WhatsApp</div>
                      <div className="text-xs text-green-100">Échange direct avec nos coordinateurs</div>
                    </div>
                  </a>

                </div>

                {/* Colonne Droite : Formulaire de Devis Interactif */}
                <div className="lg:col-span-7">
                  <div className="bg-white rounded-2xl p-8 sm:p-10 border border-slate-200 shadow-xl">
                    
                    {formSubmitted ? (
                      /* Message de confirmation élégant (Succès) */
                      <div className="py-12 px-4 text-center space-y-6">
                        <div className="w-20 h-20 rounded-full bg-green-50 border-2 border-green-500 text-green-600 flex items-center justify-center mx-auto shadow-md animate-bounce">
                          <Icon name="CheckCircle2" size={42} />
                        </div>
                        <h3 className="font-heading font-extrabold text-2xl text-brand-navy">
                          Votre demande a été enregistrée avec succès !
                        </h3>
                        <p className="text-slate-600 text-sm max-w-md mx-auto leading-relaxed">
                          Merci <strong>{formData.fullName}</strong> ({formData.company || "Votre structure"}). L'équipe de <strong>FKF Fatoukateminit et Fils</strong> examinera votre besoin en <strong>{formData.service}</strong> et reviendra vers vous dans les plus brefs délais.
                        </p>
                        
                        <div className="bg-brand-slateBg p-5 rounded-xl border border-slate-200 text-left text-xs space-y-2 max-w-md mx-auto">
                          <div className="text-brand-navy font-bold">Récapitulatif transmis :</div>
                          <div><span className="text-slate-500">Service :</span> {formData.service}</div>
                          <div><span className="text-slate-500">Contact :</span> {formData.email} | {formData.phone}</div>
                        </div>

                        <div className="pt-4">
                          <button 
                            onClick={handleResetForm}
                            className="bg-brand-navy text-white hover:bg-brand-navyLight font-heading font-bold text-xs uppercase tracking-wider py-3 px-6 rounded-lg shadow transition-colors"
                          >
                            Nouvelle demande de devis
                          </button>
                        </div>
                      </div>
                    ) : (
                      /* Formulaire de Cotation */
                      <form onSubmit={handleSubmitForm} className="space-y-6">
                        <div>
                          <h3 className="font-heading font-bold text-xl text-brand-navy mb-1">
                            Demande de cotation / Devis express
                          </h3>
                          <p className="text-slate-500 text-xs">
                            Remplissez ce formulaire pour recevoir une proposition adaptée à votre cahier des charges.
                          </p>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                          {/* Nom complet */}
                          <div>
                            <label className="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">
                              Nom complet <span className="text-red-500">*</span>
                            </label>
                            <div className="relative">
                              <span className="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                                <Icon name="User" size={18} />
                              </span>
                              <input 
                                type="text"
                                name="fullName"
                                required
                                value={formData.fullName}
                                onChange={handleFormChange}
                                placeholder="ex: Mamadou Diallo"
                                className="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 focus:border-brand-gold focus:ring-2 focus:ring-brand-gold/20 outline-none text-sm transition-all"
                              />
                            </div>
                          </div>

                          {/* Entreprise / Organisation */}
                          <div>
                            <label className="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">
                              Entreprise / Organisation <span className="text-red-500">*</span>
                            </label>
                            <div className="relative">
                              <span className="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                                <Icon name="Building" size={18} />
                              </span>
                              <input 
                                type="text"
                                name="company"
                                required
                                value={formData.company}
                                onChange={handleFormChange}
                                placeholder="ex: Consortium Minier / Entreprise"
                                className="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 focus:border-brand-gold focus:ring-2 focus:ring-brand-gold/20 outline-none text-sm transition-all"
                              />
                            </div>
                          </div>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                          {/* Adresse e-mail */}
                          <div>
                            <label className="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">
                              Adresse e-mail <span className="text-red-500">*</span>
                            </label>
                            <div className="relative">
                              <span className="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                                <Icon name="Mail" size={18} />
                              </span>
                              <input 
                                type="email"
                                name="email"
                                required
                                value={formData.email}
                                onChange={handleFormChange}
                                placeholder="contact@entreprise.com"
                                className="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 focus:border-brand-gold focus:ring-2 focus:ring-brand-gold/20 outline-none text-sm transition-all"
                              />
                            </div>
                          </div>

                          {/* Numéro de téléphone */}
                          <div>
                            <label className="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">
                              Numéro de téléphone <span className="text-red-500">*</span>
                            </label>
                            <div className="relative">
                              <span className="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                                <Icon name="Phone" size={18} />
                              </span>
                              <input 
                                type="tel"
                                name="phone"
                                required
                                value={formData.phone}
                                onChange={handleFormChange}
                                placeholder="+224 6XX XX XX XX"
                                className="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 focus:border-brand-gold focus:ring-2 focus:ring-brand-gold/20 outline-none text-sm transition-all"
                              />
                            </div>
                          </div>
                        </div>

                        {/* Type de prestation recherchée (7 Activités) */}
                        <div>
                          <label className="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">
                            Type de prestation recherchée <span className="text-red-500">*</span>
                          </label>
                          <select 
                            name="service"
                            value={formData.service}
                            onChange={handleFormChange}
                            className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-brand-gold focus:ring-2 focus:ring-brand-gold/20 outline-none text-sm transition-all bg-white font-medium text-slate-800"
                          >
                            {SITE_CONFIG.services.map((srv) => (
                              <option key={srv.id} value={srv.title}>
                                {srv.title}
                              </option>
                            ))}
                          </select>
                        </div>

                        {/* Description détaillée du besoin */}
                        <div>
                          <label className="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">
                            Description détaillée du besoin <span className="text-red-500">*</span>
                          </label>
                          <textarea 
                            name="message"
                            required
                            rows="4"
                            value={formData.message}
                            onChange={handleFormChange}
                            placeholder="Précisez le volume, la localisation à Kamsar ou Boké, la période souhaitée et les contraintes techniques..."
                            className="w-full p-4 rounded-xl border border-slate-200 focus:border-brand-gold focus:ring-2 focus:ring-brand-gold/20 outline-none text-sm transition-all resize-none"
                          ></textarea>
                        </div>

                        {/* Bouton de Soumission */}
                        <div>
                          <button 
                            type="submit"
                            disabled={isSubmitting}
                            className="w-full bg-brand-gold hover:bg-brand-goldHover text-brand-navy font-heading font-extrabold text-sm uppercase tracking-wider py-4 px-8 rounded-xl shadow-lg hover:shadow-xl transition-all duration-200 flex items-center justify-center gap-3 disabled:opacity-75"
                          >
                            {isSubmitting ? (
                              <span>Transmission en cours...</span>
                            ) : (
                              <>
                                <span>Envoyer ma demande de devis</span>
                                <Icon name="Send" size={18} />
                              </>
                            )}
                          </button>
                        </div>

                        <div className="text-center">
                          <p className="text-[11px] text-slate-400">
                            Vos données sont traitées de manière strictement confidentielle pour l'élaboration de votre devis.
                          </p>
                        </div>

                      </form>
                    )}

                  </div>
                </div>

              </div>

            </div>
          </section>

          {/* =================================================================
              G. FOOTER (Pied de page) & BOUTON FLOTTANT
              ================================================================= */}
          <footer className="bg-brand-navy text-slate-300 pt-16 pb-12 border-t border-brand-navyLight">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-10 mb-12">
                
                {/* Colonne 1 : Logo & Description */}
                <div className="space-y-4">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-lg bg-brand-navyLight flex items-center justify-center border border-brand-gold">
                      <span className="font-heading font-bold text-lg text-brand-gold">FKF</span>
                    </div>
                    <span className="font-heading font-bold text-lg text-white">
                      {SITE_CONFIG.company.fullName}
                    </span>
                  </div>
                  <p className="text-xs text-slate-400 leading-relaxed">
                    Entreprise de référence en logistique, Shipping, transport et assainissement industriel, basée à Kamsar dans la Préfecture de Boké.
                  </p>
                  <div className="text-xs text-brand-gold font-semibold">
                    📍 {SITE_CONFIG.contact.fullLocation}
                  </div>
                </div>

                {/* Colonne 2 : Navigation Rapide */}
                <div>
                  <h4 className="font-heading font-bold text-sm text-white uppercase tracking-wider mb-4 border-b border-slate-700 pb-2">
                    Navigation
                  </h4>
                  <ul className="space-y-2 text-xs">
                    <li><a href="#accueil" className="hover:text-brand-gold transition-colors">Accueil</a></li>
                    <li><a href="#a-propos" className="hover:text-brand-gold transition-colors">À propos de FKF</a></li>
                    <li><a href="#activites" className="hover:text-brand-gold transition-colors">Nos 7 Domaines d'activité</a></li>
                    <li><a href="#equipes" className="hover:text-brand-gold transition-colors">Équipes & Opérations terrain</a></li>
                    <li><a href="#contact" className="hover:text-brand-gold transition-colors">Demander un devis</a></li>
                  </ul>
                </div>

                {/* Colonne 3 : Les 7 Domaines d'Intervention */}
                <div>
                  <h4 className="font-heading font-bold text-sm text-white uppercase tracking-wider mb-4 border-b border-slate-700 pb-2">
                    Nos Domaines
                  </h4>
                  <ul className="space-y-2 text-xs">
                    {SITE_CONFIG.services.map((s) => (
                      <li key={s.id}>
                        <button 
                          onClick={() => handleSelectServiceFromCard(s.title)}
                          className="hover:text-brand-gold transition-colors text-left"
                        >
                          {s.title}
                        </button>
                      </li>
                    ))}
                  </ul>
                </div>

                {/* Colonne 4 : Coordonnées & Réseaux Sociaux */}
                <div>
                  <h4 className="font-heading font-bold text-sm text-white uppercase tracking-wider mb-4 border-b border-slate-700 pb-2">
                    Coordonnées
                  </h4>
                  <div className="space-y-3 text-xs text-slate-400">
                    <p><strong className="text-white">Localisation :</strong><br />{SITE_CONFIG.contact.addressLine}, {SITE_CONFIG.contact.country}</p>
                    <p><strong className="text-white">Téléphone :</strong><br />{SITE_CONFIG.contact.phone}</p>
                    <p><strong className="text-white">E-mail :</strong><br />{SITE_CONFIG.contact.email}</p>
                  </div>
                  <div className="pt-4 flex items-center gap-3">
                    <a href={SITE_CONFIG.socials.linkedin} className="w-8 h-8 rounded-lg bg-brand-navyLight border border-slate-700 flex items-center justify-center text-slate-300 hover:text-brand-gold hover:border-brand-gold transition-all" aria-label="LinkedIn">
                      in
                    </a>
                    <a href={SITE_CONFIG.socials.facebook} className="w-8 h-8 rounded-lg bg-brand-navyLight border border-slate-700 flex items-center justify-center text-slate-300 hover:text-brand-gold hover:border-brand-gold transition-all" aria-label="Facebook">
                      f
                    </a>
                    <a href={SITE_CONFIG.contact.whatsappHref} target="_blank" rel="noopener noreferrer" className="w-8 h-8 rounded-lg bg-[#25D366]/20 border border-[#25D366]/40 flex items-center justify-center text-[#25D366] hover:bg-[#25D366] hover:text-white transition-all" aria-label="WhatsApp">
                      <Icon name="MessageCircle" size={16} />
                    </a>
                  </div>
                </div>

              </div>

              {/* Barre de Copyright */}
              <div className="pt-8 border-t border-slate-800 text-center text-xs text-slate-500 flex flex-col sm:flex-row justify-between items-center gap-4">
                <div>
                  © 2026 FKF Fatoukateminit et Fils – Tous droits réservés.
                </div>
                <div className="text-slate-400">
                  Kamsar • Boké • République de Guinée
                </div>
              </div>

            </div>
          </footer>

          {/* Bouton Flottant WhatsApp (Bas droite) */}
          <div className="fixed bottom-6 right-6 z-50 animate-pulse-subtle">
            <a 
              href={SITE_CONFIG.contact.whatsappHref}
              target="_blank" 
              rel="noopener noreferrer"
              aria-label="Contacter sur WhatsApp"
              className="flex items-center gap-3 bg-[#25D366] hover:bg-[#20ba59] text-white py-3 px-4 rounded-full shadow-2xl border-2 border-white transition-all transform hover:scale-105 group"
            >
              <Icon name="MessageCircle" size={24} className="text-white" />
              <span className="hidden sm:inline font-heading font-bold text-xs uppercase tracking-wider pr-1">
                WhatsApp Direct
              </span>
            </a>
          </div>

        </div>
      );
    }

    // Montage de l'application React
    const rootElement = document.getElementById("root");
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
